<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1730">
<title>Watch Live · CricScore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: linear-gradient(#000b, #0000); z-index: 2; }
  .badge { padding: 4px 9px; border-radius: 7px; font-weight: 800; font-size: 12px; letter-spacing: 1px; background: #475569; }
  .badge.live { background: #E63946; }
  .brand { font-weight: 800; font-size: 13px; opacity: .85; }
  .viewers { margin-left: auto; font-size: 12px; font-weight: 700; background: #0006; padding: 4px 9px; border-radius: 7px; }

  .fs { background: #0006; border: 0; color: #fff; font-size: 16px; width: 32px; height: 28px; border-radius: 7px; cursor: pointer; }

  /* Scoreboard: one TV strip across the bottom, like a broadcast graphic */
  .board { position: fixed; left: 0; right: 0; bottom: max(1.6vh, env(safe-area-inset-bottom)); z-index: 2; display: none;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; text-transform: uppercase;
    font-size: clamp(11px, 1.45vw, 26px); box-shadow: 0 0.3em 1.2em #0009; background: #060608; }
  .board.show { display: grid; }
  .board { grid-template-columns: 7.5% 23% minmax(0, 1fr) 14% minmax(0, 1fr) 7.5%; height: 4.6em; }
  .board > div { min-width: 0; overflow: hidden; }
  .tb { display: flex; align-items: center; justify-content: center; }
  .tb span { width: 3.2em; height: 3.2em; border-radius: 50%; display: grid; place-items: center; font-weight: 900;
    font-size: 0.95em; border: 0.14em solid #FFC531; color: #fff; letter-spacing: .02em; }
  .info { background: linear-gradient(#34343c, #141418); display: flex; flex-direction: column; justify-content: center; padding: 0 .8em; gap: .15em; }
  .l1 { display: flex; align-items: center; gap: .45em; white-space: nowrap; }
  .l1 b { font-size: 1.55em; font-weight: 900; }
  .sbox { background: linear-gradient(#f0303f, #b5121f); font-size: 1.7em; font-weight: 900; padding: 0 .35em; line-height: 1.25; }
  .ov { font-size: 1.3em; font-weight: 700; }
  .l2 { font-size: 0.95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l2 .opp { color: #93a3c6; margin-right: .6em; }
  .l2 .hl { color: #FFC531; }
  .pan { display: flex; flex-direction: column; justify-content: space-around; padding: .25em .8em; position: relative; }
  .pan::before { content: ''; position: absolute; inset: 0 0 55% 0; background: #ffffff1f; pointer-events: none; }
  .r { display: flex; align-items: baseline; gap: .5em; white-space: nowrap; position: relative; }
  .r .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 1.15em; }
  .r .v { font-size: 1.4em; font-weight: 900; }
  .r .bl { font-size: 0.95em; opacity: .85; min-width: 1.6em; text-align: right; }
  .r.on .n::before { content: '🏏 '; font-size: .8em; }
  .over { background: linear-gradient(#5a5a64, #2e2e36); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em;
    border-left: 2px solid #0006; border-right: 2px solid #0006; }
  .over small { font-size: .7em; letter-spacing: .12em; color: #e4e4ea; }
  .chips { display: flex; gap: .16em; }
  .chip { min-width: 1.3em; height: 1.3em; border-radius: .65em; display: grid; place-items: center; font-size: .9em; font-weight: 900; padding: 0 .2em; }
  .chip.e { border: 1px solid #ffffff55; }
  /* Narrow screens (phone held upright): the same strip in three rows */
  @media (max-width: 700px) {
    .board { font-size: 13px; height: auto; grid-template-columns: 4.4em minmax(0, 1fr) minmax(0, 1fr) 4.4em;
      grid-template-areas: "tbat info info tbowl" "bat bat bowl bowl" "over over over over"; }
    .board > :nth-child(1) { grid-area: tbat; } .board > :nth-child(2) { grid-area: info; height: 4.2em; }
    .board > :nth-child(3) { grid-area: bat; height: 4em; } .board > :nth-child(4) { grid-area: over; flex-direction: row; height: 2.6em; gap: .8em; }
    .board > :nth-child(5) { grid-area: bowl; height: 4em; } .board > :nth-child(6) { grid-area: tbowl; }
    .tb span { width: 2.9em; height: 2.9em; }
  }

  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 30px; background: #0B1730; z-index: 1; font-size: 16px; line-height: 1.5; }
  .msg.hide { display: none; }
  .spinner { width: 36px; height: 36px; border: 4px solid #ffffff30; border-top-color: #E63946; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .unmute { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; display: none;
    background: #000a; border: 2px solid #fff6; color: #fff; font-size: 16px; font-weight: 800; padding: 14px 22px; border-radius: 30px; }
  .unmute.show { display: block; }
  .flash { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(.3); opacity: 0; z-index: 4; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 34px; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px #000a; }
  .flash .fe { font-size: clamp(36px, 6vw, 64px); line-height: 1; }
  .flash .ft { font-size: clamp(32px, 5.5vw, 64px); font-weight: 900; letter-spacing: 3px; }
  .flash .fs { font-size: clamp(13px, 1.6vw, 20px); font-weight: 700; opacity: .9; }
  /* Scorecard, shown while the camera phone has it open */
  .card { position: fixed; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center;
    padding: max(54px, env(safe-area-inset-top)) 12px calc(7em + 2vh); pointer-events: none; font-size: clamp(12px, 1.3vw, 16px); }
  .card.show { display: flex; }
  .cardIn { width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; background: #0B1730ee; border-radius: 16px;
    padding: 10px 14px 6px; box-shadow: 0 10px 40px #000a; pointer-events: auto; }
  .ch { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 2px 8px; font-weight: 900; }
  .ch b { font-size: 1.3em; } .ch span { color: #FFC531; font-size: 1.2em; white-space: nowrap; }
  .itabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .itabs span { flex: 1; text-align: center; background: #ffffff14; color: #cbd5e1; padding: 6px; border-radius: 9px; font-weight: 800; font-size: .9em; }
  .itabs span.on { background: #E11D2E; color: #fff; }
  .card table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .card th { text-align: right; color: #94a3b8; font-weight: 700; font-size: .85em; padding: 5px 4px; border-bottom: 1px solid #ffffff1a; }
  .card td { text-align: right; padding: 6px 4px; border-bottom: 1px solid #ffffff0d; white-space: nowrap; }
  .card th:first-child, .card td:first-child { text-align: left; white-space: normal; }
  .card td .ho { display: block; color: #94a3b8; font-size: .85em; }
  .card tr.cur td:first-child { color: #FFC531; font-weight: 800; }
  .card .empty { color: #94a3b8; padding: 16px 0; text-align: center; }
  @media (max-width: 700px) { .card { padding-bottom: 12.5em; font-size: 13px; } }
  .flash.go { animation: pop 3s ease forwards; }
  @keyframes pop { 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 20% { transform: translate(-50%, -50%) scale(1); }
    85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); } }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div class="top">
  <span class="badge" id="badge">OFFLINE</span>
  <span class="brand">CricScore Live</span>
  <span class="viewers" id="viewers"></span>
  <button class="fs" id="fs" title="Full screen">⛶</button>
</div>

<div class="msg" id="msg"><div class="spinner"></div><div id="msgText">Connecting…</div></div>
<button class="unmute" id="unmute">🔊 Tap for sound</button>
<div class="flash" id="flash"><div class="fe" id="fe"></div><div class="ft" id="ft"></div><div class="fs" id="fsub"></div></div>

<div class="card" id="card"><div class="cardIn" id="cardIn"></div></div>

<div class="board" id="board">
  <div class="tb"><span id="tBat"></span></div>
  <div class="info">
    <div class="l1"><b id="team"></b><span class="sbox" id="score"></span><span class="ov" id="ov"></span></div>
    <div class="l2"><span class="opp" id="opp"></span><span id="line"></span></div>
  </div>
  <div class="pan" id="batPan">
    <div class="r on" id="b1"><span class="n"></span><b class="v"></b><small class="bl"></small></div>
    <div class="r" id="b2"><span class="n"></span><b class="v"></b><small class="bl"></small></div>
  </div>
  <div class="over"><small>THIS OVER</small><div class="chips" id="chips"></div></div>
  <div class="pan" id="bowlPan">
    <div class="r" id="bw"><span class="n" id="bowler"></span><b class="v" id="bfig"></b><small class="bl" id="bov"></small></div>
    <div class="r"><span class="n" id="rateK">Current rate</span><b class="v" id="rateV"></b></div>
  </div>
  <div class="tb"><span id="tBowl"></span></div>
</div>

<script src="/rtc/socket.io.min.js"></script>
<script>
  var code = location.pathname.split('/').filter(Boolean).pop().toUpperCase();
  var $ = function (id) { return document.getElementById(id); };
  var pc = null, broadcaster = null, iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
  var lastDeliveries = null, flashTimer = null;

  function message(text, spin) {
    $('msgText').textContent = text;
    $('msg').querySelector('.spinner').style.display = spin ? 'block' : 'none';
    $('msg').className = 'msg';
    $('badge').textContent = 'OFFLINE'; $('badge').className = 'badge';
  }
  function playing() { $('msg').className = 'msg hide'; $('badge').textContent = 'LIVE'; $('badge').className = 'badge live'; }

  function closePc() { if (pc) { pc.close(); pc = null; } }

  function connect() {
    var socket = io({ path: '/rtc', transports: ['websocket', 'polling'] });
    socket.on('connect', function () { socket.emit('join', { code: code, role: 'viewer' }); });
    socket.on('full', function (n) { message('This stream is full (' + n + ' viewers). Please try again in a bit.', false); socket.disconnect(); });
    socket.on('status', function (s) {
      $('viewers').textContent = '👁 ' + s.viewers;
      if (!s.live) message('Waiting for the camera to go live…', true);
    });
    socket.on('overlay', function (o) { cardOn = !!(o && o.card); cardTab = o && o.tab >= 0 ? o.tab : -1; showCard(); });
    socket.on('ended', function () { cardOn = false; showCard(); closePc(); message('The live stream has paused. It will resume automatically.', true); });
    socket.on('signal', function (msg) {
      if (msg.data.sdp && msg.data.sdp.type === 'offer') {
        // A (new) offer from the camera phone: start a fresh connection
        closePc();
        broadcaster = msg.from;
        pc = new RTCPeerConnection({ iceServers: iceServers });
        pc.ontrack = function (e) {
          $('video').srcObject = e.streams[0];
          $('video').play().then(function () { playing(); $('unmute').className = 'unmute show'; }).catch(function () { playing(); });
        };
        pc.onicecandidate = function (e) { if (e.candidate) socket.emit('signal', { to: broadcaster, data: { candidate: e.candidate } }); };
        pc.onconnectionstatechange = function () {
          if (pc && pc.connectionState === 'failed') message('Could not connect to the camera. On some mobile networks a relay server is needed.', false);
        };
        pc.setRemoteDescription(msg.data.sdp)
          .then(function () { return pc.createAnswer(); })
          .then(function (a) { return pc.setLocalDescription(a); })
          .then(function () { socket.emit('signal', { to: broadcaster, data: { sdp: pc.localDescription } }); });
      } else if (msg.data.candidate && pc) {
        pc.addIceCandidate(msg.data.candidate).catch(function () {});
      }
    });
    socket.on('disconnect', function () { message('Reconnecting…', true); });
  }

  $('unmute').onclick = function () { $('video').muted = false; $('video').play(); $('unmute').className = 'unmute'; };

  // ── Full screen (turns a phone sideways for a landscape stream) ──
  $('fs').onclick = function () {
    var el = document.documentElement;
    if (document.fullscreenElement) return document.exitFullscreen();
    if (!el.requestFullscreen) return;
    el.requestFullscreen().then(function () {
      var v = $('video'), o = screen.orientation;
      if (o && o.lock && v.videoWidth) o.lock(v.videoWidth >= v.videoHeight ? 'landscape' : 'portrait').catch(function () {});
    }).catch(function () {});
  };
  if (!document.documentElement.requestFullscreen) $('fs').style.display = 'none';

  // ── Live scoreboard (same feed as the YouTube overlay) ──
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  // Team colours: same palette and hash as the camera studio scoreboard
  var PALETTE = [['#1D4ED8', '#0F2A7A'], ['#DC2626', '#7F1D1D'], ['#7C3AED', '#3B0F7A'], ['#059669', '#064E3B'],
    ['#EA580C', '#7C2D12'], ['#DB2777', '#701A43'], ['#0891B2', '#0C4A5E'], ['#CA8A04', '#713F12']];
  function colorIdx(name) { var h = 0; name = name || ''; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return h % PALETTE.length; }
  function abbr(name) {
    var w = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '—';
    if (w.length > 1) return w.map(function (x) { return x[0]; }).join('').slice(0, 4).toUpperCase();
    return w[0].slice(0, 3).toUpperCase();
  }
  function paint(el, c) { el.style.background = 'linear-gradient(' + c[0] + ',' + c[1] + ')'; }
  function row(el, p) {
    el.style.visibility = p ? 'visible' : 'hidden';
    if (!p) return;
    el.querySelector('.n').textContent = p.name;
    el.querySelector('.v').textContent = p.runs;
    el.querySelector('.bl').textContent = p.balls;
  }
  function ballLabel(b, matchType) {
    if (b.wicket) return 'W';
    if (b.extra === 'db') return 'DB';
    if (b.extra === 'wd' || b.extra === 'nb') { var t = matchType === 'local' ? b.runs : b.runs - 1; return b.extra + (t > 0 ? '+' + t : ''); }
    if (b.extra === 'lb' || b.extra === 'b') return b.runs + b.extra;
    return String(b.runs);
  }
  function ballStyle(b) {
    if (b.wicket) return ['#E11D2E', '#fff'];
    if (b.extra === 'db') return ['#475569', '#E2E8F0'];
    if (b.extra) return ['#F97316', '#fff'];
    if (b.runs === 6) return ['#8B2CF5', '#fff'];
    if (b.runs === 4) return ['#1E6BFF', '#fff'];
    if (b.runs === 0) return ['#ffffff24', '#93A3C6'];
    return ['#F1F5FF', '#0B1530'];
  }
  function chips(d) {
    var box = $('chips'); box.innerHTML = '';
    var list = (d.thisOver || []).slice(-6);
    list.forEach(function (b) {
      var c = document.createElement('span'), st = ballStyle(b);
      c.className = 'chip'; c.textContent = ballLabel(b, d.matchType || 'local');
      c.style.background = st[0]; c.style.color = st[1];
      box.appendChild(c);
    });
    for (var i = Math.max(0, 6 - (d.ball || 0)); i > 0 && box.children.length < 6; i--) {
      var e = document.createElement('span'); e.className = 'chip e'; box.appendChild(e);
    }
  }
  // Ball messages: SIX, FOUR, WICKET, WIDE, NO BALL, DEAD BALL (same as the camera phone)
  var MSG = {
    '6': ['🚀', 'SIX!', 'linear-gradient(135deg,#7c3aed,#4c1d95)'],
    '4': ['🔥', 'FOUR!', 'linear-gradient(135deg,#2563eb,#1e3a8a)'],
    W: ['☝️', 'WICKET!', 'linear-gradient(135deg,#dc2626,#7f1d1d)'],
    wd: ['↔️', 'WIDE', 'linear-gradient(135deg,#f97316,#9a3412)'],
    nb: ['🚫', 'NO BALL', 'linear-gradient(135deg,#e11d48,#881337)'],
    db: ['⛔', 'DEAD BALL', 'linear-gradient(135deg,#475569,#1e293b)'],
  };
  function flash(k, sub) {
    var m = MSG[k], el = $('flash');
    $('fe').textContent = m[0]; $('ft').textContent = m[1]; $('fsub').textContent = sub || '';
    el.style.background = m[2];
    el.className = 'flash'; void el.offsetWidth; el.className = 'flash go';
    clearTimeout(flashTimer); flashTimer = setTimeout(function () { el.className = 'flash'; }, 3000);
  }
  function renderScore(d) {
    if (!d || d.phase === 'waiting') { $('board').className = 'board'; return; }
    $('board').className = 'board show';
    var ia = colorIdx(d.battingTeam), ib = colorIdx(d.bowlingTeam);
    if (ib === ia) ib = (ib + 1) % PALETTE.length;
    var cBat = PALETTE[ia], cBowl = PALETTE[ib];
    paint($('tBat'), cBat); paint($('tBowl'), cBowl);
    $('tBat').parentNode.style.background = 'linear-gradient(' + cBat[1] + ',#0b0b10)';
    $('tBowl').parentNode.style.background = 'linear-gradient(' + cBowl[1] + ',#0b0b10)';
    paint($('batPan'), cBat); paint($('bowlPan'), cBowl);
    $('tBat').textContent = abbr(d.battingTeam);
    $('tBowl').textContent = abbr(d.bowlingTeam);
    var balls = d.over * 6 + d.ball, max = d.overs * 6, crr = balls ? (d.runs / balls * 6).toFixed(2) : '0.00';
    $('team').textContent = abbr(d.battingTeam);
    $('score').textContent = d.runs + '-' + d.wickets;
    $('ov').textContent = d.over + '.' + d.ball;
    $('opp').textContent = 'v ' + abbr(d.bowlingTeam);
    chips(d);
    $('line').className = '';
    if (d.phase === 'innings_end') {
      row($('b1'), null); row($('b2'), null); $('bw').style.visibility = 'hidden';
      $('line').textContent = d.inningsNum === 2 ? (d.result || 'Match complete') : 'Innings break · ' + abbr(d.bowlingTeam) + ' need ' + (d.runs + 1);
      $('line').className = 'hl';
      $('rateK').textContent = 'Run rate'; $('rateV').textContent = crr;
      return;
    }
    row($('b1'), d.striker); row($('b2'), d.nonStriker);
    $('bw').style.visibility = d.bowler ? 'visible' : 'hidden';
    if (d.bowler) {
      $('bowler').textContent = '⚾ ' + d.bowler.name;
      $('bfig').textContent = d.bowler.wickets + '-' + d.bowler.runs;
      $('bov').textContent = d.bowler.overs + '.' + d.bowler.balls;
    }
    $('rateK').textContent = 'Current rate'; $('rateV').textContent = crr;
    if (d.target) {
      var need = Math.max(0, d.target - d.runs), left = Math.max(0, max - balls);
      $('line').textContent = need === 0 ? 'Target reached' : 'Need ' + need + ' off ' + plural(left, 'ball');
      $('line').className = 'hl';
      if (need && left) { $('rateK').textContent = 'Required rate'; $('rateV').textContent = (need / left * 6).toFixed(2); }
    } else {
      $('line').textContent = (d.inningsNum === 2 ? '2nd' : '1st') + ' innings' + (d.overs ? ' · ' + d.overs + ' overs' : '');
    }
    if (lastDeliveries !== null && d.deliveries > lastDeliveries && d.lastBall) {
      var b = d.lastBall;
      var given = d.matchType === 'local' ? 0 : 1, extraRuns = b.runs - given;
      if (b.wicket) flash('W');
      else if (b.extra === 'wd' || b.extra === 'nb') flash(b.extra, extraRuns > 0 ? '+' + extraRuns + ' run' + (extraRuns > 1 ? 's' : '') : b.extra === 'nb' ? 'Free hit next ball' : '');
      else if (b.extra === 'db') flash('db');
      else if (!b.extra && b.runs === 6) flash('6');
      else if (!b.extra && b.runs === 4) flash('4');
    }
    lastDeliveries = d.deliveries;
  }
  function pollScore() {
    fetch('/api/live/' + code + '/overlay', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; }).then(renderScore).catch(function () {})
      .then(function () { setTimeout(pollScore, 1000); });
  }

  // ── Scorecard: shown while the camera phone has it open (same innings it shows) ──
  var card = null, cardTab = -1, cardOn = false, cardTimer = null;
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function sr(r, b) { return b ? (r / b * 100).toFixed(1) : '-'; }
  function econ(r, o, b) { var balls = o * 6 + b; return balls ? (r / balls * 6).toFixed(2) : '-'; }
  function showCard() {
    $('card').className = cardOn ? 'card show' : 'card';
    clearInterval(cardTimer);
    if (!cardOn) return;
    renderCard();
    loadCard();
    cardTimer = setInterval(loadCard, 4000);
  }
  function loadCard() {
    fetch('/api/live/' + code + '/scorecard', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { card = d; renderCard(); } })
      .catch(function () {});
  }
  function renderCard() {
    var box = $('cardIn');
    if (!card || !card.innings || !card.innings.length) { box.innerHTML = '<div class="empty">Loading scorecard…</div>'; return; }
    var t = cardTab >= 0 && cardTab < card.innings.length ? cardTab : card.innings.length - 1, inn = card.innings[t];
    var h = '<div class="ch"><b>📋 ' + esc(inn.team || 'Innings ' + (t + 1)) + '</b><span>' + esc(inn.runs) + '/' + esc(inn.wickets) + ' (' + esc(inn.overs) + '.' + esc(inn.balls) + ' ov)</span></div>';
    if (card.innings.length > 1) h += '<div class="itabs">' + card.innings.map(function (x, i) {
      return '<span class="' + (i === t ? 'on' : '') + '">' + esc(x.team || 'Innings ' + (i + 1)) + ' ' + esc(x.runs) + '/' + esc(x.wickets) + '</span>';
    }).join('') + '</div>';
    h += '<table><tr><th>Batting</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>';
    h += inn.batting.length ? inn.batting.map(function (b) {
      var how = b.out ? b.howOut || 'out' : b.atCrease ? 'not out' : '';
      return '<tr class="' + (b.atCrease ? 'cur' : '') + '"><td>' + (b.onStrike ? '🏏 ' : '') + esc(b.name) + (how ? '<span class="ho">' + esc(how) + '</span>' : '') + '</td><td><b>' + esc(b.runs) + '</b></td><td>' + esc(b.balls) + '</td><td>' + esc(b.fours) + '</td><td>' + esc(b.sixes) + '</td><td>' + sr(b.runs, b.balls) + '</td></tr>';
    }).join('') : '<tr><td colspan="6">—</td></tr>';
    h += '</table><table><tr><th>Bowling</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>';
    h += inn.bowling.length ? inn.bowling.map(function (b) {
      return '<tr class="' + (b.bowling ? 'cur' : '') + '"><td>' + (b.bowling ? '⚾ ' : '') + esc(b.name) + '</td><td>' + esc(b.overs) + '.' + esc(b.balls) + '</td><td>' + esc(b.maidens) + '</td><td>' + esc(b.runs) + '</td><td><b>' + esc(b.wickets) + '</b></td><td>' + econ(b.runs, b.overs, b.balls) + '</td></tr>';
    }).join('') : '<tr><td colspan="6">—</td></tr>';
    box.innerHTML = h + '</table>';
  }

  if (!window.RTCPeerConnection) message('This browser can’t play live video. Please open the link in Chrome or Safari.', false);
  else fetch('/api/stream-ice').then(function (r) { return r.json(); }).then(function (d) { iceServers = d.iceServers; })
    .catch(function () {}).then(connect);
  pollScore();
</script>
