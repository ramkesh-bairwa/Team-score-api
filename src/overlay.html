<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CricScore Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  /* Transparent page for OBS / Prism / Streamlabs. Laid out on a 1280x720 stage that scales to any
     browser-source size (720p, 1080p, 4K). */
  :root {
    --ink: #050B1A; --panel: #0B1530; --panel2: #121F45; --line: rgba(255, 255, 255, .09);
    --gold: #FFC531; --gold2: #F59E0B; --red: #EF233C; --muted: #8FA0C2; --soft: #C9D3EA; --white: #fff;
    --four: #1E6BFF; --six: #8B2CF5; --extra: #F97316;
    /* Team colours, set from the team names by script */
    --t1: #1D4ED8; --t1d: #0F2A7A; --t2: #DC2626; --t2d: #7F1D1D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif; color: var(--white); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }

  /* ── Top-left match bug ─────────────────────────────────────────── */
  .bug {
    position: absolute; top: 22px; left: 24px; display: flex; align-items: stretch; height: 34px;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .45)); transition: opacity .4s, transform .5s;
  }
  .bug.hidden { opacity: 0; transform: translateY(-20px); }
  .bug .live {
    display: flex; align-items: center; gap: 7px; padding: 0 14px 0 12px; background: var(--red);
    font-weight: 900; font-size: 18px; letter-spacing: 2px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  .bug .live i { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
  .bug .title {
    display: flex; align-items: center; gap: 8px; margin-left: -10px; padding: 0 22px 0 22px; background: var(--panel);
    font-weight: 800; font-size: 19px; letter-spacing: 1px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  .bug .title b { color: var(--gold); font-weight: 800; }
  .bug .inn {
    display: flex; align-items: center; margin-left: -10px; padding: 0 18px 0 20px;
    background: linear-gradient(90deg, var(--panel2), #1A2B5C); color: var(--soft); font-weight: 700; font-size: 15px;
    letter-spacing: 1.5px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  @keyframes blink { 50% { opacity: .2; } }

  /* ── Main scoreboard ───────────────────────────────────────────── */
  .board {
    position: absolute; left: 24px; right: 24px; bottom: 22px;
    filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .55));
    transition: opacity .5s, transform .6s cubic-bezier(.2, .9, .3, 1.1);
  }
  .board.hidden { opacity: 0; transform: translateY(60px); }
  .strip {
    position: relative; display: flex; align-items: stretch; height: 84px; overflow: hidden;
    background: linear-gradient(180deg, #16244D 0%, var(--panel) 55%, #08112A 100%);
    border-radius: 6px 6px 0 0; border-top: 2px solid rgba(255, 255, 255, .14);
  }
  /* glossy highlight across the top half */
  .strip::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0)); pointer-events: none;
  }

  .team {
    position: relative; display: flex; align-items: center; gap: 14px; width: 352px; flex: none;
    padding: 0 40px 0 14px; background: linear-gradient(135deg, var(--t1) 0%, var(--t1d) 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%);
  }
  .team::before { /* diagonal stripes texture */
    content: ""; position: absolute; inset: 0; opacity: .12; pointer-events: none;
    background: repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 14px);
  }
  .badge {
    position: relative; flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fff, #DCE3F2 70%); color: var(--t1d);
    font-weight: 900; font-size: 20px; letter-spacing: .5px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .35), 0 4px 10px rgba(0, 0, 0, .35);
  }
  .tinfo { position: relative; min-width: 0; display: flex; flex-direction: column; line-height: 1; }
  .tname {
    font-size: 16px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; opacity: .9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
  }
  .tscore { display: flex; align-items: baseline; gap: 10px; margin-top: 3px; }
  .runs { font-size: 50px; font-weight: 900; letter-spacing: -.5px; text-shadow: 0 2px 6px rgba(0, 0, 0, .35); display: inline-block; }
  .runs.bump { animation: bump .55s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.18); color: var(--gold); } 100% { transform: scale(1); } }
  .tov { font-size: 20px; font-weight: 700; color: rgba(255, 255, 255, .85); }
  .tov small { font-size: 15px; opacity: .75; }

  .cell {
    position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 20px;
    border-left: 1px solid var(--line);
  }
  .cell:first-of-type { border-left: 0; }
  .lbl { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbl b { color: var(--soft); font-weight: 800; }

  .batters { width: 318px; flex: none; margin-left: -6px; padding-left: 20px; gap: 3px; }
  .p { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; line-height: 1.15; color: var(--soft); }
  .p .mk { width: 16px; flex: none; display: grid; place-items: center; }
  .p .mk svg { width: 15px; height: 15px; fill: var(--gold); opacity: 0; transform: scale(.4) rotate(-30deg); transition: all .35s; }
  .p.on { color: var(--white); }
  .p.on .mk svg { opacity: 1; transform: none; }
  .p .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .3px; }
  .p .fig { font-weight: 800; font-variant-numeric: tabular-nums; }
  .p .fig small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .p.on .fig { color: var(--gold); }

  .bowler { width: 250px; flex: none; }
  .bowler::before { /* bowling team colour accent */
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 2px;
    background: linear-gradient(180deg, var(--t2), var(--t2d));
  }
  .bowler .p { color: var(--white); }

  .over { flex: 1; min-width: 0; }
  .chips { display: flex; align-items: center; gap: 6px; }
  .chip {
    flex: none; min-width: 34px; height: 34px; padding: 0 5px; border-radius: 17px; display: grid; place-items: center;
    font-size: 17px; font-weight: 900; background: rgba(255, 255, 255, .12); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
  }
  .chip.c0 { color: var(--muted); }
  .chip.c4 { background: linear-gradient(180deg, #3B82F6, var(--four)); }
  .chip.c6 { background: linear-gradient(180deg, #A855F7, var(--six)); }
  .chip.cw { background: linear-gradient(180deg, #FF4D5E, var(--red)); }
  .chip.cx { background: linear-gradient(180deg, #FB923C, var(--extra)); font-size: 14px; }
  .chip.cd { background: #475569; color: #CBD5E1; font-size: 14px; }
  .chip.empty { background: transparent; box-shadow: none; border: 2px dashed rgba(255, 255, 255, .18); }
  .chip.new { animation: chipIn .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes chipIn { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }

  /* ── Bottom ticker ─────────────────────────────────────────────── */
  .ticker {
    position: relative; display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 0 0 20px;
    background: linear-gradient(90deg, var(--gold) 0%, #FFD860 50%, var(--gold) 100%); color: #1A1300;
    border-radius: 0 0 6px 6px; overflow: hidden;
  }
  .ticker::after { /* light sweep */
    content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -150px;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent); animation: sweep 6s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 70% { left: -150px; } 100% { left: 110%; } }
  .tk-main { font-size: 21px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk-main em { font-style: normal; font-weight: 900; color: #B00020; }
  .tk-stats { display: flex; height: 100%; flex: none; }
  .stat {
    display: flex; align-items: center; gap: 7px; padding: 0 16px; background: var(--ink); color: var(--white);
    font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-left: -8px;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%);
  }
  .stat:first-child { padding-left: 22px; }
  .stat:nth-child(even) { background: #14204A; }
  .stat span { color: var(--gold); font-size: 14px; letter-spacing: 1.5px; }

  /* End-of-over / info toast above the board */
  .toast {
    position: absolute; left: 24px; bottom: 150px; display: flex; align-items: stretch; height: 36px;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .45)); opacity: 0; transform: translateX(-40px); transition: all .45s cubic-bezier(.2, .9, .3, 1.1);
  }
  .toast.show { opacity: 1; transform: none; }
  .toast .a { display: flex; align-items: center; padding: 0 18px 0 14px; background: var(--gold); color: #1A1300; font-weight: 900; font-size: 18px; letter-spacing: 1.5px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .toast .b { display: flex; align-items: center; margin-left: -10px; padding: 0 22px; background: var(--panel); font-weight: 800; font-size: 19px; letter-spacing: .5px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }

  /* ── Boundary / wicket / milestone banner ──────────────────────── */
  .event { position: absolute; left: 0; right: 0; top: 30%; height: 190px; pointer-events: none; display: none; }
  .event.go { display: block; }
  .ev-band {
    position: absolute; left: -5%; right: -5%; top: 30px; height: 130px; transform: skewY(-4deg);
    animation: bandIn 3.4s cubic-bezier(.7, 0, .2, 1) forwards; overflow: hidden;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .85), 0 20px 60px rgba(0, 0, 0, .5);
  }
  .ev-band::before { /* speed streaks */
    content: ""; position: absolute; inset: 0; opacity: .18;
    background: repeating-linear-gradient(90deg, #fff 0 3px, transparent 3px 46px);
    animation: streak .5s linear infinite;
  }
  .ev-band::after { /* shine */
    content: ""; position: absolute; top: 0; bottom: 0; width: 220px; left: -260px;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); animation: shine 1.1s .35s ease-out;
  }
  .k4 .ev-band { background: linear-gradient(90deg, #0A2E8A, var(--four) 30%, #4F8CFF 50%, var(--four) 70%, #0A2E8A); }
  .k6 .ev-band { background: linear-gradient(90deg, #3B0A7A, var(--six) 30%, #B46CFF 50%, var(--six) 70%, #3B0A7A); }
  .kw .ev-band { background: linear-gradient(90deg, #5C0011, var(--red) 30%, #FF5A6E 50%, var(--red) 70%, #5C0011); }
  .km .ev-band { background: linear-gradient(90deg, #7A4A00, var(--gold2) 30%, #FFE08A 50%, var(--gold2) 70%, #7A4A00); }
  .ev-text {
    position: absolute; left: 0; right: 0; top: 30px; text-align: center; transform: skewY(-4deg);
    font-size: 132px; line-height: 130px; font-weight: 900; font-style: italic; letter-spacing: 10px;
    text-shadow: 0 6px 0 rgba(0, 0, 0, .25), 0 0 40px rgba(255, 255, 255, .45);
    animation: textIn 3.4s cubic-bezier(.2, 1.2, .3, 1) forwards;
  }
  .km .ev-text { color: #2A1800; text-shadow: 0 4px 0 rgba(255, 255, 255, .35); font-size: 112px; }
  .ev-sub {
    position: absolute; left: 50%; top: 172px; transform: translateX(-50%); max-width: 920px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 9px 26px; background: var(--ink); border-left: 5px solid var(--gold); font-size: 24px; font-weight: 700; letter-spacing: .5px;
    animation: subIn 3.4s ease forwards;
  }
  .ev-sub:empty { display: none; }
  @keyframes bandIn {
    0% { clip-path: inset(0 100% 0 0); }
    12% { clip-path: inset(0 0 0 0); }
    86% { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }
  @keyframes textIn {
    0%, 8% { opacity: 0; transform: skewY(-4deg) translateX(-200px) scale(1.6); }
    22% { opacity: 1; transform: skewY(-4deg) translateX(0) scale(1); }
    84% { opacity: 1; transform: skewY(-4deg) translateX(20px) scale(1); }
    100% { opacity: 0; transform: skewY(-4deg) translateX(300px) scale(1); }
  }
  @keyframes subIn { 0%, 18% { opacity: 0; margin-top: 20px; } 28%, 86% { opacity: 1; margin-top: 0; } 100% { opacity: 0; } }
  @keyframes streak { to { background-position: 46px 0; } }
  @keyframes shine { to { left: 110%; } }

  .spark { position: absolute; left: 50%; top: 95px; width: 10px; height: 10px; border-radius: 2px; animation: spark 1.6s cubic-bezier(.1, .8, .3, 1) forwards; }
  @keyframes spark {
    0% { transform: translate(-50%, -50%) rotate(0); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity: 0; }
  }

  /* ── Innings break / result card ───────────────────────────────── */
  .card {
    position: absolute; left: 50%; top: 50%; width: 640px; transform: translate(-50%, -50%) scale(.9); opacity: 0;
    transition: all .5s cubic-bezier(.2, 1.2, .3, 1); filter: drop-shadow(0 24px 60px rgba(0, 0, 0, .6)); pointer-events: none;
  }
  .card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .card .head {
    margin: 0 auto; width: 70%; height: 42px; display: grid; place-items: center; background: var(--gold); color: #1A1300;
    font-size: 22px; font-weight: 900; letter-spacing: 5px; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
  }
  .card .body {
    display: flex; align-items: center; gap: 24px; padding: 28px 34px;
    background: linear-gradient(135deg, var(--t1) 0%, var(--t1d) 45%, var(--panel) 100%); border-top: 3px solid var(--gold);
  }
  .card .badge { width: 92px; height: 92px; font-size: 30px; }
  .card .info { min-width: 0; }
  .card .cname { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cscore { font-size: 72px; font-weight: 900; line-height: 1; }
  .card .cscore small { font-size: 26px; font-weight: 700; opacity: .8; margin-left: 8px; }
  .card .foot { padding: 14px 24px; background: var(--ink); text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
  .card .foot em { font-style: normal; color: var(--gold); }

  .waiting {
    position: absolute; left: 24px; bottom: 22px; display: none; align-items: center; gap: 12px; height: 46px; padding: 0 22px 0 16px;
    background: var(--panel); border-left: 5px solid var(--gold); font-size: 22px; font-weight: 800; letter-spacing: 1px;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .45));
  }
  .waiting.show { display: flex; }
  .waiting i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .2); border-top-color: var(--gold); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="stage">
  <div class="bug hidden" id="bug">
    <div class="live"><i></i>LIVE</div>
    <div class="title" id="bugTitle"></div>
    <div class="inn" id="bugInn"></div>
  </div>

  <div class="toast" id="toast"><div class="a" id="toastA"></div><div class="b" id="toastB"></div></div>

  <div class="board hidden" id="board">
    <div class="strip">
      <div class="team">
        <div class="badge" id="badge"></div>
        <div class="tinfo">
          <div class="tname" id="tname"></div>
          <div class="tscore"><span class="runs" id="score">0/0</span><span class="tov" id="ov"></span></div>
        </div>
      </div>
      <div class="cell batters">
        <div class="p on" id="b1"><span class="mk"><svg viewBox="0 0 24 24"><path d="M20.7 2.3a1 1 0 0 0-1.4 0l-3.6 3.6-1-1a1 1 0 0 0-1.4 0L3.4 14.8a2 2 0 0 0 0 2.8l3 3a2 2 0 0 0 2.8 0l9.9-9.9a1 1 0 0 0 0-1.4l-1-1 3.6-3.6a1 1 0 0 0 0-1.4z"/></svg></span><span class="nm"></span><span class="fig"></span></div>
        <div class="p" id="b2"><span class="mk"><svg viewBox="0 0 24 24"><path d="M20.7 2.3a1 1 0 0 0-1.4 0l-3.6 3.6-1-1a1 1 0 0 0-1.4 0L3.4 14.8a2 2 0 0 0 0 2.8l3 3a2 2 0 0 0 2.8 0l9.9-9.9a1 1 0 0 0 0-1.4l-1-1 3.6-3.6a1 1 0 0 0 0-1.4z"/></svg></span><span class="nm"></span><span class="fig"></span></div>
      </div>
      <div class="cell bowler">
        <div class="lbl" id="blbl"></div>
        <div class="p"><span class="nm" id="bowler"></span><span class="fig" id="bfig"></span></div>
      </div>
      <div class="cell over">
        <div class="lbl">This over</div>
        <div class="chips" id="over"></div>
      </div>
    </div>
    <div class="ticker"><div class="tk-main" id="status"></div><div class="tk-stats" id="rates"></div></div>
  </div>

  <div class="event" id="event"><div class="ev-band"></div><div class="ev-text" id="evText"></div><div class="ev-sub" id="evSub"></div></div>

  <div class="card" id="card">
    <div class="head" id="cardTitle"></div>
    <div class="body">
      <div class="badge" id="cardBadge"></div>
      <div class="info"><div class="cname" id="cardName"></div><div class="cscore" id="cardScore"></div></div>
    </div>
    <div class="foot" id="cardFoot"></div>
  </div>

  <div class="waiting show" id="err"><i></i><span id="errText">Match starting soon…</span></div>
</div>

<script>
  var code = location.pathname.split('/').filter(Boolean).pop();
  var api = '/api/live/' + encodeURIComponent(code) + '/overlay';
  var lastVersion = 0, lastDeliveries = null, matchType = 'local';
  var prevScore = null, lastOver = null, overStartRuns = null, overStartWkts = 0, seenRuns = {};
  var queue = [], playing = false, toastTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  // Scale the 1280x720 stage to whatever size the browser source is
  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 720);
    var st = $('stage');
    st.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  // Team colours: stable per team name
  var PALETTE = [
    ['#1D4ED8', '#0F2A7A'], ['#DC2626', '#7F1D1D'], ['#7C3AED', '#3B0F7A'], ['#059669', '#064E3B'],
    ['#EA580C', '#7C2D12'], ['#DB2777', '#701A43'], ['#0891B2', '#0C4A5E'], ['#CA8A04', '#713F12']
  ];
  function colorIdx(name) {
    var h = 0;
    for (var i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return h % PALETTE.length;
  }
  function setTeamColors(bat, bowl) {
    var a = colorIdx(bat), b = colorIdx(bowl);
    if (b === a) b = (a + 1) % PALETTE.length;
    var r = document.documentElement.style;
    r.setProperty('--t1', PALETTE[a][0]); r.setProperty('--t1d', PALETTE[a][1]);
    r.setProperty('--t2', PALETTE[b][0]); r.setProperty('--t2d', PALETTE[b][1]);
  }
  function abbr(name) {
    var w = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '—';
    if (w.length > 1) return w.map(function (x) { return x[0]; }).join('').slice(0, 4).toUpperCase();
    return w[0].slice(0, 3).toUpperCase();
  }

  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ballLabel(b) {
    if (b.wicket) return 'W';
    if (b.extra === 'db') return 'DB';
    if (b.extra === 'wd' || b.extra === 'nb') {
      var taken = matchType === 'local' ? b.runs : b.runs - 1;
      return (b.extra === 'wd' ? 'Wd' : 'Nb') + (taken > 0 ? '+' + taken : '');
    }
    if (b.extra === 'lb') return 'Lb' + b.runs;
    if (b.extra === 'b') return 'B' + b.runs;
    return b.runs === 0 ? '•' : String(b.runs);
  }
  function ballClass(b) {
    if (b.wicket) return 'cw';
    if (b.extra === 'db') return 'cd';
    if (b.extra) return 'cx';
    if (b.runs === 6) return 'c6';
    if (b.runs === 4) return 'c4';
    if (b.runs === 0) return 'c0';
    return '';
  }
  function setPlayer(row, p) {
    row.style.visibility = p ? 'visible' : 'hidden';
    if (!p) return;
    row.querySelector('.nm').textContent = p.name;
    var fig = row.querySelector('.fig');
    fig.textContent = p.runs;
    fig.appendChild(el('small', '', '(' + p.balls + ')'));
  }

  // ── Banners: played one at a time so a boundary that brings up a fifty shows both ──
  function enqueue(kind, title, sub) { queue.push([kind, title, sub]); if (!playing) next(); }
  function next() {
    var e = queue.shift(), ev = $('event');
    if (!e) { playing = false; ev.className = 'event'; return; }
    playing = true;
    ev.className = 'event';
    void ev.offsetWidth; // restart the animations
    $('evText').textContent = e[1];
    $('evSub').textContent = e[2] || '';
    Array.prototype.slice.call(ev.querySelectorAll('.spark')).forEach(function (s) { s.remove(); });
    if (e[0] === '6' || e[0] === 'm') sparks(ev, e[0] === '6' ? ['#fff', '#C084FC', '#FFC531'] : ['#fff', '#FFC531', '#F59E0B']);
    ev.className = 'event go k' + e[0];
    setTimeout(next, 3500);
  }
  function sparks(host, colors) {
    for (var i = 0; i < 36; i++) {
      var s = el('span', 'spark'), a = Math.random() * Math.PI * 2, d = 180 + Math.random() * 420;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d * .55 + 'px');
      s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (.25 + Math.random() * .25) + 's';
      host.appendChild(s);
    }
  }
  function toast(a, b) {
    $('toastA').textContent = a; $('toastB').textContent = b;
    $('toast').className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').className = 'toast'; }, 5000);
  }

  function showCard(title, team, score, foot) {
    $('cardTitle').textContent = title;
    $('cardBadge').textContent = abbr(team);
    $('cardName').textContent = team;
    $('cardScore').textContent = score.main;
    $('cardScore').appendChild(el('small', '', score.sub));
    var f = $('cardFoot');
    f.textContent = '';
    foot.forEach(function (part, i) { f.appendChild(i % 2 ? el('em', '', part) : document.createTextNode(part)); });
    $('card').className = 'card show';
  }

  function render(d) {
    var waiting = d.phase === 'waiting';
    $('err').className = waiting ? 'waiting show' : 'waiting';
    if (waiting) {
      $('errText').textContent = 'Match starting soon…';
      $('board').className = 'board hidden'; $('bug').className = 'bug hidden'; $('card').className = 'card';
      return;
    }

    setTeamColors(d.battingTeam, d.bowlingTeam);
    $('bugTitle').textContent = '';
    $('bugTitle').appendChild(el('b', '', abbr(d.battingTeam)));
    $('bugTitle').appendChild(document.createTextNode(' v ' + abbr(d.bowlingTeam)));
    $('bugInn').textContent = (d.inningsNum === 2 ? '2ND' : '1ST') + ' INNINGS · ' + d.overs + ' OVERS';
    $('bug').className = 'bug';

    var totalBalls = d.over * 6 + d.ball, maxBalls = d.overs * 6;
    var crr = totalBalls ? (d.runs / totalBalls * 6).toFixed(2) : '0.00';
    var scoreTxt = d.runs + '/' + d.wickets;

    if (d.phase === 'innings_end') {
      $('board').className = 'board hidden';
      var sc = { main: scoreTxt, sub: '(' + d.over + '.' + d.ball + ' ov)' };
      if (d.inningsNum === 2) showCard('RESULT', d.battingTeam, sc, d.result ? ['', d.result] : ['Match complete']);
      else showCard('INNINGS BREAK', d.battingTeam, sc, [d.bowlingTeam + ' need ', plural(d.runs + 1, 'run'), ' to win from ' + d.overs + ' overs']);
      lastDeliveries = null; lastOver = null; prevScore = null;
      return;
    }
    matchType = d.matchType || 'local';
    $('card').className = 'card';
    $('board').className = 'board';

    $('badge').textContent = abbr(d.battingTeam);
    $('tname').textContent = d.battingTeam;
    var sEl = $('score');
    sEl.textContent = scoreTxt;
    if (prevScore !== null && prevScore !== scoreTxt) { sEl.classList.remove('bump'); void sEl.offsetWidth; sEl.classList.add('bump'); }
    prevScore = scoreTxt;
    $('ov').textContent = d.over + '.' + d.ball;
    $('ov').appendChild(el('small', '', ' / ' + d.overs + ' ov'));

    setPlayer($('b1'), d.striker);
    setPlayer($('b2'), d.nonStriker);

    $('blbl').textContent = 'Bowling · ';
    $('blbl').appendChild(el('b', '', abbr(d.bowlingTeam)));
    if (d.bowler) {
      $('bowler').textContent = d.bowler.name;
      $('bfig').textContent = d.bowler.wickets + '-' + d.bowler.runs;
      $('bfig').appendChild(el('small', '', '(' + d.bowler.overs + '.' + d.bowler.balls + ')'));
    } else { $('bowler').textContent = ''; $('bfig').textContent = ''; }

    var isNew = lastDeliveries !== null && d.deliveries > lastDeliveries && d.lastBall;
    var chips = $('over'), balls = d.thisOver || [];
    chips.textContent = '';
    balls.forEach(function (b, i) {
      chips.appendChild(el('span', 'chip ' + ballClass(b) + (isNew && i === balls.length - 1 ? ' new' : ''), ballLabel(b)));
    });
    for (var i = 0; i < Math.max(0, 6 - d.ball); i++) chips.appendChild(el('span', 'chip empty'));

    // Ticker
    var st = $('status'), rates = $('rates');
    st.textContent = ''; rates.textContent = '';
    function stat(k, v) { var s = el('div', 'stat'); s.appendChild(el('span', '', k)); s.appendChild(document.createTextNode(v)); rates.appendChild(s); }
    if (d.target) {
      var need = Math.max(0, d.target - d.runs), left = Math.max(0, maxBalls - totalBalls);
      if (need === 0) st.textContent = d.battingTeam + ' have reached the target!';
      else {
        st.appendChild(document.createTextNode(d.battingTeam + ' need '));
        st.appendChild(el('em', '', plural(need, 'run')));
        st.appendChild(document.createTextNode(' from '));
        st.appendChild(el('em', '', plural(left, 'ball')));
      }
      stat('TARGET', d.target);
      stat('CRR', crr);
      if (left && need) stat('RRR', (need / left * 6).toFixed(2));
    } else {
      var proj = totalBalls ? Math.round(d.runs / totalBalls * maxBalls) : 0;
      st.textContent = d.battingTeam + ' v ' + d.bowlingTeam;
      stat('CRR', crr);
      if (proj) stat('PROJECTED', proj);
    }

    // Animate only new deliveries (not the state we found on first load, and not undos)
    if (isNew) {
      var b = d.lastBall;
      if (b.wicket) enqueue('w', 'WICKET', d.lastCommentary);
      else if (!b.extra && b.runs === 6) enqueue('6', 'SIX', d.lastCommentary);
      else if (!b.extra && b.runs === 4) enqueue('4', 'FOUR', d.lastCommentary);
    }

    // Milestones for the batters at the crease
    [d.striker, d.nonStriker].forEach(function (p) {
      if (!p) return;
      var prev = seenRuns[p.name];
      if (prev != null && isNew) {
        if (prev < 100 && p.runs >= 100) enqueue('m', 'CENTURY', p.name + '  ' + p.runs + ' (' + p.balls + ')');
        else if (prev < 50 && p.runs >= 50) enqueue('m', 'FIFTY', p.name + '  ' + p.runs + ' (' + p.balls + ')');
      }
      seenRuns[p.name] = p.runs;
    });

    // End-of-over summary, only for overs we watched from the first ball
    if (lastOver !== null && d.over === lastOver + 1 && d.ball === 0 && overStartRuns !== null) {
      var r = d.runs - overStartRuns, w = d.wickets - overStartWkts;
      toast('END OF OVER ' + d.over, plural(r, 'run') + (w > 0 ? ' · ' + plural(w, 'wicket') : '') + '  ·  ' + d.battingTeam + ' ' + scoreTxt);
    }
    if (d.over !== lastOver) {
      var atStart = d.ball === 0 && !(d.thisOver || []).length;
      overStartRuns = atStart ? d.runs : null;
      overStartWkts = d.wickets;
    }
    lastOver = d.over;
    lastDeliveries = d.deliveries;
  }

  function poll() {
    fetch(api, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        if (d.version !== lastVersion) { lastVersion = d.version; render(d); }
      })
      .catch(function (status) {
        $('board').className = 'board hidden';
        $('errText').textContent = status === 404 ? 'Match code ' + code + ' not found' : 'Reconnecting…';
        $('err').className = 'waiting show';
        lastVersion = 0;
      })
      .then(function () { setTimeout(poll, 1000); });
  }
  poll();
</script>
</body>
</html>
