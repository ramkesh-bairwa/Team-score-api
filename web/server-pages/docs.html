<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CricScore API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar-home { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #0f3d2e; color: #fff; font: 600 15px system-ui, sans-serif; }
    .topbar-home a { color: #9fe3c0; text-decoration: none; font-weight: 500; }
    .topbar-home a:hover { text-decoration: underline; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="topbar-home">
    <span>🏏 CricScore API</span>
    <a href="/">← Welcome</a>
    <a href="/openapi.json" style="margin-left:auto">openapi.json</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'list',
      tryItOutEnabled: true,
      persistAuthorization: true,
      displayRequestDuration: true,
      filter: true,
    });
  </script>
</body>
</html>
