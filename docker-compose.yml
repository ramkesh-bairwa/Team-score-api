# CricScore: API (score.glamofashion.com, port 3200) + live-stream camera app (port 3300, served under /stream by the API).
#
# Production (on the VPS, in /var/www/cricscore):
#   docker compose up -d --build
#   docker compose run --rm live-stream node_modules/.bin/tsx scripts/migrate.ts   # first time: create the live-stream tables
# Local: see docker-compose.local.yml
#
# Needs .env (API) and live-stream/.env next to this file; LIVE_STREAM_SECRET in .env must equal
# INTEGRATION_SECRET in live-stream/.env. Host networking keeps the ports behind Nginx and reaches MySQL on 127.0.0.1.
name: cricscore

services:
  api:
    image: cricscore-api:latest
    container_name: cricscore-api
    build: .
    network_mode: host
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data      # JSON store when STORAGE is not mysql
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - live-stream

  live-stream:
    image: cricscore-live-stream:latest
    container_name: cricscore-live-stream
    build:
      context: ./live-stream
      network: host
      secrets: [livestream_env]
    network_mode: host
    volumes:
      - ./live-stream/.env:/app/.env:ro
      - ./live-stream/recordings:/app/recordings   # recordings survive rebuilds
    restart: unless-stopped

secrets:
  livestream_env:
    file: ./live-stream/.env
